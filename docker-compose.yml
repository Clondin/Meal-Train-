version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mealtrain
      POSTGRES_USER: mealtrain
      POSTGRES_PASSWORD: mealtrain
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealtrain -d mealtrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://mealtrain:mealtrain@postgres:5432/mealtrain?schema=public
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:4000
      JWT_SECRET: change-me
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      SENDGRID_API_KEY: SG.placeholder
      AWS_ACCESS_KEY_ID: placeholder
      AWS_SECRET_ACCESS_KEY: placeholder
      AWS_S3_BUCKET: mealtrain-uploads
      AWS_REGION: us-east-1
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    ports:
      - "3000:3000"

volumes:
  postgres-data:
